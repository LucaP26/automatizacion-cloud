name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Un push nuevo a la misma branch cancela la corrida anterior todavía en
# curso: no tiene sentido terminar de testear un commit ya reemplazado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: automation_user
          POSTGRES_PASSWORD: automation_pass
          POSTGRES_DB: automation_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation_user"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://automation_user:automation_pass@localhost:5432/automation_db
      TEST_DATABASE_URL: postgresql+psycopg://automation_user:automation_pass@localhost:5432/automation_test_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # Claves descartables, generadas en cada corrida: ningún secreto real
      # de la app vive en GitHub (ni hace falta para testear).
      - name: Generar claves de test
        run: |
          echo "SECRET_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Crear base de test
        run: PGPASSWORD=automation_pass psql -h localhost -U automation_user -d automation_db -c "CREATE DATABASE automation_test_db"

      # Los tests crean el schema con create_all(); esto prueba aparte que
      # la cadena de migraciones de Alembic aplica de cero sobre una base
      # vacía -- lo mismo que va a hacer el servicio `migrate` en la VM.
      - name: Migraciones de Alembic sobre base vacía
        run: alembic upgrade head

      - name: Construir imagen sandbox
        run: docker build -f docker/sandbox.Dockerfile -t automation-sandbox:latest docker

      - name: pytest
        run: pytest -v

  e2e:
    name: Build + smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mismo .env mínimo que genera cloud-init en la VM de Azure: si el
      # stack levanta acá solo con esto, levanta allá.
      - name: Generar .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "SECRET_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Build de las imágenes
        run: docker compose build

      - name: Levantar el stack
        run: docker compose up -d --wait

      - name: Smoke test
        run: ./scripts/smoke-test.sh http://localhost:8000

      - name: Logs del stack (si algo falló)
        if: failure()
        run: docker compose logs --no-color

      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false: valida sintaxis y schema de los providers sin
      # credenciales de Azure. El apply real se corre a mano (ver README).
      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate
